services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  loowid:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/loowid
      - SESSION_SECRET=change-me-in-production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    volumes:
      - recordings_data:/app/recordings
    depends_on:
      - mongodb

volumes:
  mongo_data:
  recordings_data:
